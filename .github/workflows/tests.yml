name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  regression:
    name: API + UI regression (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests
        run: mvn -B clean test -Dheadless=true

      # Runs even when tests fail, which is exactly when the report is needed.
      - name: Generate HTML report
        if: always()
        run: mvn -B surefire-report:report-only

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: |
            target/reports/
            target/surefire-reports/

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore
